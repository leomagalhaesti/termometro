name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with the system's built-in Python 3 (standard library only)
        shell: bash
        run: |
          PY=$(command -v python || command -v python3)
          "$PY" --version
          "$PY" -m unittest discover -s tests -v
